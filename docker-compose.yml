version: "3.9"

# Gyan Sathi — local development stack
# Usage: docker compose up --build
# (Supabase users: backend can use Supabase Postgres via DATABASE_URL instead
#  of the local postgres service; set DATABASE_URL and remove the postgres
#  service or ignore it.)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gyan
      POSTGRES_PASSWORD: gyan_dev_password
      POSTGRES_DB: gyansathi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyan -d gyansathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gyan:gyan_dev_password@postgres:5432/gyansathi
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
